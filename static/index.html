<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0714">
<title>幸运抽奖</title>
<style>
  :root{
    --bg:#0b0714;
    --bg2:#150b26;
    --gold:#f6c453;
    --gold2:#ffdf8e;
    --purple:#8b5cf6;
    --pink:#ec4899;
    --cyan:#22d3ee;
    --green:#34d399;
    --text:#f5f1ff;
    --muted:#a99fc4;
    --line:rgba(255,255,255,.12);
    --line-strong:rgba(255,255,255,.2);
    --glass:rgba(255,255,255,.055);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(circle at 12% 6%, rgba(139,92,246,.22), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(236,72,153,.16), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(246,196,83,.1), transparent 46%),
      linear-gradient(180deg,#0d0818 0%, #0b0714 55%, #07040d 100%);
    overflow-x:hidden;
  }
  body::after{
    content:"";
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:3px 3px;opacity:.25;
  }
  #confetti{position:fixed;inset:0;z-index:80;pointer-events:none}

  h1,h2,h3,h4{margin:0;line-height:1.25}
  p{margin:.4rem 0}
  a{color:var(--gold)}
  code{font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace}
  .muted{color:var(--muted)}
  .small{font-size:.8rem}
  .center{text-align:center}
  .container{max-width:1160px;margin:0 auto;padding:1.5rem 1.25rem 5rem}
  .eyebrow{letter-spacing:.35em;font-size:.7rem;color:var(--gold);text-transform:uppercase;font-weight:700}
  .hide{display:none !important}

  /* ---------- glass & cards ---------- */
  .glass{
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1.25rem;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 18px 50px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .glass h3{font-size:1rem;margin-bottom:.85rem}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:1rem}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
  .spacer{height:1rem}

  /* ---------- hero ---------- */
  .hero{position:relative;text-align:center;max-width:920px;margin:0 auto;padding:clamp(2.4rem,6vw,4.6rem) 1.25rem 1.2rem}
  .hero .logo{font-size:clamp(2.2rem,5vw,3.2rem);filter:drop-shadow(0 4px 18px rgba(246,196,83,.45));display:inline-block;animation:bob 3.2s ease-in-out infinite}
  .hero h1{
    font-size:clamp(2rem,5.4vw,3.5rem);font-weight:800;letter-spacing:.02em;margin:.55rem 0 .7rem;
    background:linear-gradient(115deg,#ffffff 8%,#ffdf8e 42%,#f472b6 88%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 8px 30px rgba(236,72,153,.18));
  }
  .hero-meta{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:center}
  .hero-sub{color:var(--muted);font-size:.95rem;max-width:560px;margin:.4rem auto 0}

  /* ---------- badges & chips ---------- */
  .badge{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .7rem;border-radius:999px;font-size:.76rem;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .badge-green{background:rgba(52,211,153,.14);color:#6ee7b7;border-color:rgba(52,211,153,.34)}
  .badge-blue{background:rgba(56,189,248,.14);color:#7dd3fc;border-color:rgba(56,189,248,.34)}
  .badge-gold{background:rgba(246,196,83,.16);color:var(--gold2);border-color:rgba(246,196,83,.4)}
  .badge-gray{background:rgba(255,255,255,.07);color:var(--muted);border-color:var(--line)}
  .badge-pink{background:rgba(236,72,153,.14);color:#f9a8d4;border-color:rgba(236,72,153,.34)}
  .online-pill{font-size:.78rem;color:#6ee7b7;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);padding:.3rem .65rem;border-radius:999px;white-space:nowrap}
  .level-badge{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.04em;color:#2a1a00;background:linear-gradient(135deg,var(--gold),#f0a13c);white-space:nowrap}
  .level-badge.sm{font-size:.66rem;padding:.14rem .45rem}
  .type-badge{display:inline-block;font-size:.7rem;color:var(--muted);border:1px solid var(--line);padding:.16rem .5rem;border-radius:999px}
  .chip{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .65rem;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:.8rem}
  .chip small{color:var(--muted);font-size:.7rem}
  .chips{display:flex;flex-wrap:wrap;gap:.45rem}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
    padding:.62rem 1.05rem;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--text);font-size:.9rem;font-weight:600;
    font-family:inherit;cursor:pointer;transition:transform .16s,background .16s,filter .16s,box-shadow .16s;
    text-decoration:none;line-height:1.2;white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
  .btn-primary{background:linear-gradient(135deg,var(--gold2),#f0a13c);color:#2a1a00;border-color:transparent;box-shadow:0 8px 24px rgba(246,196,83,.26)}
  .btn-primary:hover{background:linear-gradient(135deg,#ffe9a8,#f5ab48);filter:brightness(1.03)}
  .btn-purple{background:linear-gradient(135deg,var(--purple),#d946ef);color:#fff;border-color:transparent;box-shadow:0 8px 24px rgba(139,92,246,.3)}
  .btn-danger{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.35);color:#fca5a5}
  .btn-danger:hover{background:rgba(239,68,68,.22)}
  .btn-ghost{background:transparent}
  .btn-sm{padding:.38rem .68rem;font-size:.78rem;border-radius:9px}
  .btn-row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}
  .btn-row.center{justify-content:center}

  /* ---------- forms ---------- */
  .field{display:block;margin-bottom:.9rem;font-size:.84rem;color:var(--muted);font-weight:600}
  .input,.textarea,.select{
    display:block;width:100%;margin-top:.35rem;
    background:rgba(8,5,16,.55);border:1px solid var(--line);border-radius:12px;
    padding:.66rem .82rem;color:var(--text);font-size:.95rem;font-family:inherit;outline:none;
    transition:border .15s,box-shadow .15s;
  }
  .input:focus,.textarea:focus,.select:focus{border-color:rgba(246,196,83,.65);box-shadow:0 0 0 3px rgba(246,196,83,.13)}
  .textarea{resize:vertical;min-height:110px;line-height:1.5}
  .select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .form-stack{display:flex;flex-direction:column}
  .form-stack .btn-row{margin-top:.4rem}
  .hint{font-size:.78rem;color:var(--muted);margin-top:.45rem}
  .warn-text{color:#fbbf24 !important}

  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px dashed rgba(255,255,255,.09)}
  .switch-row:last-of-type{border-bottom:none}
  .switch-title{font-size:.9rem;font-weight:600}
  .switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .slider{position:absolute;inset:0;background:rgba(255,255,255,.15);border-radius:999px;transition:.2s;cursor:pointer}
  .slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:linear-gradient(135deg,var(--purple),var(--pink))}
  .switch input:checked + .slider::before{transform:translateX(20px)}
  .switch input:focus-visible + .slider{box-shadow:0 0 0 3px rgba(246,196,83,.25)}

  /* ---------- joining ---------- */
  .join-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1rem;align-items:start}
  .join-card{padding:1.5rem}
  .join-card h2{font-size:1.35rem;margin-bottom:.35rem}
  .join-form{display:flex;gap:.55rem;margin-top:1rem}
  .join-form .input{margin-top:0;font-size:1rem;padding:.8rem .9rem}
  .join-form .btn{padding:.8rem 1.25rem;font-size:.95rem}

  .me-card{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
  .avatar{
    width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:1.4rem;font-weight:800;color:#2a1a00;
    background:linear-gradient(135deg,var(--gold2),#f0a13c);
    box-shadow:0 8px 24px rgba(246,196,83,.3);
  }
  .me-card h2{font-size:1.3rem}
  .me-count{margin-left:auto;text-align:right}
  .me-count b{font-size:1.6rem;display:block;background:linear-gradient(135deg,var(--gold2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .me-count span{font-size:.75rem;color:var(--muted)}

  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin-bottom:1rem}
  .stat{padding:.9rem 1rem;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line)}
  .stat .num{font-size:1.55rem;font-weight:800;letter-spacing:.01em;background:linear-gradient(135deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .lbl{font-size:.75rem;color:var(--muted);margin-top:.1rem}

  /* ---------- prizes ---------- */
  .prize-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:.9rem}
  .prize-card{position:relative;padding:1rem;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);overflow:hidden;transition:transform .18s,border-color .18s}
  .prize-card:hover{transform:translateY(-2px);border-color:rgba(246,196,83,.34)}
  .prize-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--purple))}
  .prize-card h3{font-size:1.05rem;margin:.55rem 0 .3rem}
  .prize-reward{font-size:.86rem;color:var(--text);opacity:.9;min-height:1.2em}
  .prize-qty{font-size:.76rem;color:var(--muted);margin-top:.5rem}
  .prize-admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.9rem}
  .prize-admin-card{position:relative;padding:1.1rem;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .prize-top{display:flex;align-items:center;gap:.45rem;justify-content:space-between}
  .cdk-list{display:flex;flex-wrap:wrap;gap:.35rem;max-height:160px;overflow:auto;margin-top:.5rem;padding-right:.2rem}
  .cdk-list code{font-size:.72rem;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:.15rem .4rem;word-break:break-all}
  details summary{cursor:pointer;color:var(--muted);font-size:.78rem;margin-top:.6rem}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.3rem;margin-bottom:1rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:.55rem 1.05rem;border-radius:999px;border:none;background:transparent;color:var(--muted);font-size:.86rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.16s}
  .tab:hover{color:var(--text)}
  .tab.active{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;box-shadow:0 6px 20px rgba(139,92,246,.35)}
  .tab-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
  .tab-head h2{font-size:1.3rem}

  /* ---------- admin top ---------- */
  .admin-top{max-width:1160px;margin:0 auto;padding:1.1rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:space-between}
  .admin-brand{display:flex;align-items:center;gap:.7rem}
  .admin-brand .logo{font-size:1.8rem}
  .admin-title{font-size:1.05rem;font-weight:800}
  .top-actions{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}

  /* ---------- schedule / banner ---------- */
  .banner{display:flex;align-items:center;gap:.9rem;padding:.85rem 1.1rem;border-radius:16px;border:1px solid rgba(56,189,248,.3);background:linear-gradient(120deg,rgba(56,189,248,.12),rgba(139,92,246,.1));margin-bottom:1rem;flex-wrap:wrap}
  .banner-icon{font-size:1.3rem}
  .banner-title{font-weight:700;font-size:.92rem}
  .banner-count{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;color:#7dd3fc;font-size:.95rem}
  .schedule-card{margin-top:1rem;border-color:rgba(56,189,248,.28);background:linear-gradient(150deg,rgba(56,189,248,.1),rgba(139,92,246,.08))}
  .schedule-box{padding:.9rem;border-radius:14px;border:1px dashed rgba(56,189,248,.4);background:rgba(56,189,248,.07);margin-top:.8rem}
  .schedule-title{font-weight:800;color:#7dd3fc;font-size:.86rem}
  .schedule-name{font-size:.92rem;margin:.3rem 0}
  .schedule-empty{margin-top:.8rem}
  .countdown-line{font-variant-numeric:tabular-nums;font-weight:800;color:#7dd3fc;margin-top:.3rem}

  /* ---------- history ---------- */
  .history-list{display:flex;flex-direction:column;gap:.65rem}
  .history-item{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);overflow:hidden}
  .history-item summary{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem .9rem;list-style:none}
  .history-item summary::-webkit-details-marker{display:none}
  .history-item summary b{font-size:.92rem;display:block}
  .history-item summary .muted{display:block;margin-top:.15rem;font-size:.75rem}
  .chev{color:var(--muted);transition:transform .2s;font-size:1.1rem}
  .history-item[open] .chev{transform:rotate(90deg)}
  .history-body{padding:.2rem .9rem .8rem;border-top:1px dashed rgba(255,255,255,.09)}
  .h-row{display:grid;grid-template-columns:minmax(70px,.8fr) minmax(0,1.4fr) minmax(0,1.2fr);gap:.75rem;align-items:center;padding:.45rem 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:.85rem}
  .h-row:last-child{border-bottom:none}
  .h-name{font-weight:700}
  .h-prize{color:var(--text);opacity:.9}
  .h-reward{justify-self:end;text-align:right}

  .history-card{margin-bottom:.8rem}
  .history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.6rem}
  .history-head h3{font-size:1.02rem;margin-bottom:.2rem}
  .badge-count{font-size:.76rem;font-weight:800;color:var(--gold2);background:rgba(246,196,83,.12);border:1px solid rgba(246,196,83,.3);padding:.2rem .6rem;border-radius:999px;white-space:nowrap}
  .history-rows{display:flex;flex-direction:column}
  .history-foot{margin-top:.5rem;padding-top:.5rem;border-top:1px dashed rgba(255,255,255,.08)}

  /* ---------- my results ---------- */
  .my-result-list{display:flex;flex-direction:column;gap:.6rem}
  .my-result{padding:.8rem .9rem;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
  .my-result.won{border-color:rgba(246,196,83,.4);background:linear-gradient(140deg,rgba(246,196,83,.1),rgba(236,72,153,.06))}
  .mr-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.88rem;font-weight:600}
  .mr-head .muted{margin-left:auto;font-weight:400}
  .mr-prize{font-size:1.05rem;font-weight:800;margin:.5rem 0 .4rem}
  .status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
  .status-dot.excluded{background:#fbbf24}
  .status-dot.not_won{background:#64748b}
  .result-icon{font-size:3rem;text-align:center;line-height:1;margin-bottom:.4rem;animation:pop .4s}
  .result-title{text-align:center;font-size:1.6rem;margin-bottom:.3rem}
  .result-prize{text-align:center;font-size:1.35rem;font-weight:800;margin:.7rem 0;background:linear-gradient(120deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .result-reward{text-align:center;font-size:1.1rem;font-weight:700;margin:.6rem 0}
  .result-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem;max-height:46vh;overflow:auto;padding-right:.2rem}
  .result-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.55rem .65rem;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);flex-wrap:wrap}
  .rr-index{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(246,196,83,.16);color:var(--gold2);font-size:.7rem;font-weight:800;flex:none}
  .rr-main{display:flex;align-items:center;gap:.65rem;min-width:0}
  .rr-name{font-weight:700;font-size:.92rem}
  .rr-reward{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
  .small{font-size:.78rem}

  /* ---------- CDK ---------- */
  .cdk-label{text-align:center;font-size:.76rem;letter-spacing:.16em;color:var(--muted);margin-top:.7rem;text-transform:uppercase}
  .cdk-box{display:flex;align-items:center;gap:.55rem;justify-content:center;flex-wrap:wrap;padding:.8rem;margin:.5rem 0;border-radius:14px;border:1px dashed rgba(246,196,83,.5);background:rgba(246,196,83,.07)}
  .cdk-box code{font-size:1.05rem;font-weight:700;color:var(--gold2);word-break:break-all;text-align:center}
  .cdk-box.compact{padding:.55rem .7rem;margin:.55rem 0 0;justify-content:space-between}
  .cdk-box.compact code{font-size:.9rem;text-align:left}
  .cdk-inline{font-size:.82rem;color:var(--gold2);background:rgba(246,196,83,.1);border:1px solid rgba(246,196,83,.25);border-radius:7px;padding:.15rem .45rem;word-break:break-all}

  /* ---------- links ---------- */
  .link-row{display:flex;align-items:center;gap:.5rem;padding:.55rem 0;border-bottom:1px dashed rgba(255,255,255,.08);flex-wrap:wrap}
  .link-label{font-size:.75rem;color:var(--muted);width:82px;flex:none}
  .link-code{font-size:.74rem;color:var(--text);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:7px;padding:.25rem .45rem;word-break:break-all;flex:1;min-width:0}
  .warn{margin-top:.8rem;padding:.75rem .85rem;border-radius:12px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.08);color:#fde68a;font-size:.8rem;line-height:1.55}

  .empty{padding:1.6rem;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed rgba(255,255,255,.14);border-radius:14px}

  /* ---------- participants ---------- */
  .p-list{display:flex;flex-direction:column}
  .p-row{display:flex;align-items:center;gap:.7rem;padding:.55rem .3rem;border-bottom:1px dashed rgba(255,255,255,.07);font-size:.88rem;flex-wrap:wrap}
  .p-row:last-child{border-bottom:none}
  .dot{width:8px;height:8px;border-radius:50%;background:#475569;flex:none}
  .dot.on{background:var(--green);box-shadow:0 0 10px rgba(52,211,153,.7)}
  .pr-name{font-weight:700;min-width:120px;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
  .pr-time{margin-left:auto;color:var(--muted);font-size:.74rem}
  .mini-badge{font-size:.62rem;font-weight:700;color:#fbbf24;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.1);border-radius:999px;padding:.05rem .4rem}

  /* ---------- draw ---------- */
  .draw-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:1rem;align-items:start}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.6rem 0 1rem}
  .mode-card{position:relative;display:block;padding:.8rem;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;transition:.16s}
  .mode-card input{position:absolute;opacity:0;pointer-events:none}
  .mode-card .mode-title{font-weight:800;font-size:.9rem}
  .mode-card small{display:block;color:var(--muted);font-size:.72rem;margin-top:.25rem;line-height:1.4}

</style>

<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toasts" aria-live="polite"></div>
<div id="app"></div>
<div id="modalRoot" class="modal-root"></div>
<div id="drawOverlay" class="draw-overlay" aria-live="assertive"></div>

<script>
"use strict";

/* ============================================================
   Basics
   ============================================================ */
function parseRoute() {
  const path = location.pathname.replace(/\/+$/, "") || "/";
  let m = path.match(/^\/s\/([^/]+)\/admin$/);
  if (m) return { view: "admin", code: decodeURIComponent(m[1]) };
  m = path.match(/^\/s\/([^/]+)$/);
  if (m) return { view: "participant", code: decodeURIComponent(m[1]) };
  return { view: "entry", code: null };
}
const ROUTE = parseRoute();
const IS_ENTRY = ROUTE.view === "entry";
const IS_ADMIN = ROUTE.view === "admin";
const ROOM_CODE = ROUTE.code;
const LS_LAST = "luckyDraw.lastRoom";
const LS_P = ROOM_CODE ? "luckyDraw.pToken." + ROOM_CODE : "luckyDraw.pToken";
const LS_A = ROOM_CODE ? "luckyDraw.aToken." + ROOM_CODE : "luckyDraw.aToken";
const API = (path) => "/api/rooms/" + encodeURIComponent(ROOM_CODE || "") + path;
const roomURL = (code) => location.origin + "/s/" + encodeURIComponent(code || ROOM_CODE || "");
const adminURLFor = (code) => roomURL(code) + "/admin";

const app = {
  role: IS_ENTRY ? "entry" : IS_ADMIN ? "admin" : "participant",
  participantToken: ROOM_CODE ? localStorage.getItem(LS_P) || null : null,
  adminToken: ROOM_CODE ? localStorage.getItem(LS_A) || null : null,
  publicState: null,
  participantState: null,
  adminState: null,
  adminTab: "overview",
  drafts: { eventName: null, cooldownDays: null, search: "", joinName: "" },
  drawDraft: { title: "", mode: "wheel", prizeIds: new Set() },
  editingPrizeId: null,
  activeDrawId: null,
  shownResults: new Set(),
  busy: false,
  roomMissing: false,
  entryNotice: "",
};

let serverOffset = 0;
let refreshTimer = null;
let overlayTimer = null;
let scrambleTimer = null;

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

const dtfShort = new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
const dtfFull = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });

function fmtTime(iso, full = true) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return (full ? dtfFull : dtfShort).format(d);
}

function syncServer(state) {
  if (state && state.server_time) {
    const t = new Date(state.server_time).getTime();
    if (!isNaN(t)) serverOffset = t - Date.now();
  }
}
function serverNow() { return Date.now() + serverOffset; }

function pad(n) { return String(n).padStart(2, "0"); }
function localDatetimeValue(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fileStamp() {
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

/* ============================================================
   API
   ============================================================ */
function detailMessage(detail, status) {
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) {
    const parts = detail.map((d) => (d && (d.msg || d.detail)) || "").filter(Boolean);
    if (parts.length) return parts.join("；");
  }
  return `请求失败 (${status})`;
}

async function api(path, options = {}) {
  const method = options.method || "GET";
  const headers = {};
  let token;
  if (options.token === null) token = null;
  else if (options.token !== undefined) token = options.token;
  else token = IS_ADMIN ? app.adminToken : IS_ENTRY ? null : app.participantToken;
  if (options.body !== undefined) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = "Bearer " + token;

  let res;
  try {
    res = await fetch(path, {
      method,
      headers,
      body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
    });
  } catch (err) {
    const e = new Error("网络连接失败，请检查网络后重试");
    e.status = 0;
    throw e;
  }

  const ct = res.headers.get("content-type") || "";
  let data = null;
  if (ct.includes("application/json")) {
    data = await res.json().catch(() => null);
  }
  if (!res.ok) {
    const err = new Error(detailMessage(data && data.detail, res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ============================================================
   Toast / copy / modal
   ============================================================ */
function toast(message, type = "info", ms = 3200) {
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = message;
  box.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .3s, transform .3s";
    el.style.opacity = "0";
    el.style.transform = "translateY(-6px)";
    setTimeout(() => el.remove(), 320);
  }, ms);
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast("已复制", "success", 1600);
  } catch (e) {
    toast("复制失败，请手动选择复制", "error");
  }
}

function openModal(html, opts = {}) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-backdrop" data-modal-backdrop><div class="modal ${opts.wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const backdrop = root.querySelector("[data-modal-backdrop]");
  backdrop.addEventListener("mousedown", (e) => {
    if (e.target === backdrop && opts.closable !== false) closeModal();
  });
  document.body.style.overflow = "hidden";
  if (opts.onMount) {
    try { opts.onMount(root); } catch (e) {}
  }
  setTimeout(() => {
    const focusable = root.querySelector("input, textarea, select, button:not(.icon-btn)");
    if (focusable && window.innerWidth > 820) {
      try { focusable.focus({ preventScroll: true }); } catch (e) {}
    }
  }, 50);
}

function closeModal() {
  document.getElementById("modalRoot").innerHTML = "";
  document.body.style.overflow = "";
}

function openConfirm({ title, message, confirmText = "确认", danger = false, onConfirm }) {
  openModal(`
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭">✕</button></div>
    <p class="muted">${esc(message)}</p>
    <div class="btn-row">
      <button class="btn btn-ghost" data-action="close-modal">取消</button>
      <button class="btn ${danger ? "btn-danger" : "btn-primary"}" id="confirmBtn">${esc(confirmText)}</button>
    </div>
  `, {
    onMount(root) {
      root.querySelector("#confirmBtn").addEventListener("click", async () => {
        const btn = root.querySelector("#confirmBtn");
        btn.disabled = true;
        try { await onConfirm(); } finally { btn.disabled = false; }
      });
    },
  });
}

/* ============================================================
   Confetti
   ============================================================ */
const confettiCanvas = document.getElementById("confetti");
let confettiParticles = [];
let confettiRaf = 0;

function fireConfetti() {
  const c = confettiCanvas;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ["#f6c453", "#ffdf8e", "#8b5cf6", "#ec4899", "#22d3ee", "#34d399", "#fb923c"];
  confettiParticles = Array.from({ length: 190 }, () => ({
    x: w / 2 + (Math.random() - 0.5) * w * 0.55,
    y: h * 0.34 + (Math.random() - 0.5) * 90,
    vx: (Math.random() - 0.5) * 10,
    vy: -Math.random() * 12 - 3,
    g: 0.22 + Math.random() * 0.14,
    size: 5 + Math.random() * 8,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.32,
    color: colors[(Math.random() * colors.length) | 0],
    life: 0,
    ttl: 110 + Math.random() * 80,
    shape: Math.random() < 0.45 ? "rect" : "circle",
  }));
  cancelAnimationFrame(confettiRaf);
  const start = performance.now();

  function loop(now) {
    ctx.clearRect(0, 0, w, h);
    let alive = false;
    for (const p of confettiParticles) {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.992;
      p.rot += p.vr;
      if (p.life < p.ttl && p.y < h + 50) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, (p.ttl - p.life) / 40));
      ctx.fillStyle = p.color;
      if (p.shape === "rect") ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    if (alive && now - start < 6000) confettiRaf = requestAnimationFrame(loop);
    else ctx.clearRect(0, 0, w, h);
  }
  confettiRaf = requestAnimationFrame(loop);
}

/* ============================================================
   Countdowns
   ============================================================ */
function updateCountdowns() {
  const now = serverNow();
  $$("[data-countdown]").forEach((el) => {
    const target = new Date(el.dataset.countdown).getTime();
    if (isNaN(target)) return;
    const diff = target - now;
    if (diff <= 0) {
      el.textContent = el.dataset.done || "已到时间";
      return;
    }
    const s = Math.ceil(diff / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    el.textContent = d > 0
      ? `${d} 天 ${h} 小时 ${m} 分`
      : h > 0 ? `${h} 时 ${m} 分 ${sec} 秒`
      : `${m} 分 ${sec} 秒`;
  });
}
setInterval(updateCountdowns, 500);

/* ============================================================
   Shared label helpers
   ============================================================ */
const STATUS_MAP = {
  ready: ["名单抽奖", "blue"],
  registering: ["报名中", "green"],
  scheduled: ["已定时开奖", "blue"],
  drawing: ["开奖中", "gold"],
  waiting: ["等待中", "gray"],
};
function statusBadge(status) {
  const [label, tone] = STATUS_MAP[status] || ["进行中", "gray"];
  return `<span class="badge badge-${tone}">${label}</span>`;
}
function prizeLabel(w) {
  return [w.prize_level, w.prize_title].filter(Boolean).join(" · ");
}
function defaultDrawTitle() {
  const n = (app.adminState && app.adminState.stats && app.adminState.stats.draw_count || 0) + 1;
  return `第 ${n} 轮抽奖`;
}
function shuffle(list) {
  const arr = list.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ============================================================
   Render switch
   ============================================================ */
function render() {
  const root = document.getElementById("app");
  if (IS_ENTRY) renderEntry(root);
  else if (app.roomMissing) renderRoomMissing(root);
  else if (IS_ADMIN) renderAdmin(root);
  else renderParticipant(root);
  updateCountdowns();
}

/* ============================================================
   Entry page & missing room
   ============================================================ */
function renderEntry(root) {
  document.title = "幸运抽奖 · 多空间版";
  root.innerHTML = `
    <header class="hero" style="padding-bottom:.6rem">
      <div class="eyebrow">LUCKY DRAW · 多空间抽奖</div>
      <div style="margin-top:.6rem"><span class="logo">🎡</span></div>
      <h1>同一个网址，各自独立开奖</h1>
      <p class="hero-sub">每位发起者用自己设置的 PIN 进入专属后台；参与者用同一个参与网址加入当前空间。多个活动互不干扰。</p>
    </header>
    <main class="container" style="padding-top:.4rem">
      ${app.entryNotice ? `<div class="warn">${esc(app.entryNotice)}</div>` : ""}
      <div class="grid2">
        <section class="glass">
          <h2 style="font-size:1.15rem">🎯 参与者</h2>
          <p class="muted small">如果你拿到了某个活动空间的参与链接，直接打开即可加入。</p>
          <form id="joinCodeForm" class="join-form" autocomplete="off">
            <input class="input" name="code" maxlength="32" placeholder="输入空间码（6 位）">
            <button class="btn btn-primary" type="submit">进入活动</button>
          </form>
          <p class="hint">参与者入口统一为 <code>网址/s/空间码</code>，由发起者分享。</p>
          <div class="link-row">
            <div class="link-label">活动首页</div>
            <code class="link-code">${esc(location.origin + "/")}</code>
            <button class="btn btn-sm" data-copy="${esc(location.origin + "/")}">复制</button>
          </div>
        </section>

        <section class="glass">
          <h2 style="font-size:1.15rem">👑 发起者</h2>
          ${app.adminToken ? `
            <p class="muted small">你已登录空间 <b>${esc(ROOM_CODE)}</b>（${esc(app.adminState ? app.adminState.event.name : "")}）。</p>
            <div class="btn-row"><button class="btn btn-primary" data-action="goto-own-admin">进入我的后台</button></div>
          ` : `
            <form id="adminPinForm" class="join-form" autocomplete="off">

              <button class="btn btn-primary" type="submit">进入后台</button>

          `}
          <div class="warn" style="margin-top:.9rem">还没有空间？在下方创建即可，设置 PIN 后会自动进入后台。</div>
          <form id="createRoomForm" class="form-stack" style="margin-top:.7rem">

              <input class="input" name="name" maxlength="120" placeholder="如：2026 年会抽奖">
            </label>
            <label class="field">设置你的管理 PIN（至少 4 位，建议 6 位数字）
              <input class="input" name="pin" type="password" inputmode="numeric" maxlength="32" required placeholder="例如 202611">
            </label>
            <label class="field">再输入一次 PIN

function renderParticipant(root) {

function participantHero(state, compact) {

function participantJoinedHTML(s) {

      </section>
      ${me.cooldown ? `<div class="banner" style="border-color:rgba(251,191,36,.35);background:linear-gradient(120deg,rgba(251,191,36,.12),rgba(236,72,153,.08))">
          <div class="banner-icon">🕒</div>
          <div class="banner-body"><div class="banner-title">你目前在冷却期内</div><div class="muted small">${fmtTime(me.cooldown.last_won_at)} 中奖，冷却至 ${fmtTime(me.cooldown.until)}，期间不参与抽取。</div></div>
        </div>` : ""}

      </section>

        <h3>奖项墙 <span class="muted small">（${s.prizes.length}）</span></h3>
        ${prizeGrid(s.prizes)}
      </section>
      ${publicHistorySection(s)}

function statHTML(label, value) {
  return `<div class="stat"><div class="num">${esc(value)}</div><div class="lbl">${esc(label)}</div></div>`;
}

function participantScheduleBanner(s) {
  if (!s.schedule) return "";
  const sc = s.schedule;
  const prizes = (sc.prizes || []).map((p) => `${p.title}×${p.quantity}`).join(" · ");
  return `<div class="banner">
    <div class="banner-icon">⏰</div>
    <div class="banner-body">
      <div class="banner-title">定时开奖：${esc(sc.title)}</div>
      <div class="muted small">${fmtTime(sc.at)} · ${esc(prizes)}</div>
    </div>
    <div class="banner-count" data-countdown="${esc(sc.at)}" data-done="即将开始">--</div>
  </div>`;
}

function prizeGrid(prizes) {
  if (!prizes || !prizes.length) return `<div class="empty">主办方还没有添加奖项</div>`;
  return `<div class="prize-grid">${prizes.map((p) => `
    <div class="prize-card">
      <span class="level-badge">${esc(p.level || "奖品")}</span>
      <h3>${esc(p.title)}</h3>
      <div class="prize-reward">${p.is_cdk || p.reward_type === "cdk" ? "专属 CDK · 每人唯一" : esc(p.reward_name || p.title)}</div>
      <div class="prize-qty">名额 × ${p.quantity}</div>
    </div>`).join("")}</div>`;
}

function myResultsHTML(s) {
  const rs = s.my_results || [];
  if (!rs.length) {
    return `<p class="muted">还没有参与过开奖。开奖结束后，结果会显示在这里，重新打开页面也能看到。</p>`;
  }
  return `<div class="my-result-list">${rs.map((r) => {
    if (r.status === "won") {
      return `<div class="my-result won">
        <div class="mr-head">
          <span class="level-badge">${esc(r.prize_level || "奖品")}</span>
          <span>${esc(r.prize_title)}</span>
          <span class="muted small">${esc(r.draw_title)} · ${fmtTime(r.finished_at)}</span>
        </div>
        ${r.reward_type === "cdk"
          ? `<div class="cdk-box compact"><code>${esc(r.cdk)}</code><button class="btn btn-sm" data-copy="${esc(r.cdk)}">复制 CDK</button></div>`
          : `<div class="muted" style="margin-top:.5rem">奖品：${esc(r.reward_name)}</div>`}
      </div>`;
    }
    const label = r.status === "excluded" ? "近期已中奖 · 本轮未参与" : "未中奖";
    return `<div class="my-result">
      <div class="mr-head"><span class="status-dot ${r.status === "excluded" ? "excluded" : "not_won"}"></span><span>${label}</span>
      <span class="muted small">${esc(r.draw_title)} · ${fmtTime(r.finished_at)}</span></div>
    </div>`;
  }).join("")}</div>`;
}

function publicHistorySection(s) {
  return `<section class="glass">
    <h3>开奖历史 <span class="muted small">（${(s.history || []).length} 轮）</span></h3>
    ${publicHistoryHTML(s)}
  </section>`;
}

function publicHistoryHTML(s) {
  const list = s.history || [];
  if (!list.length) return `<div class="empty">还没有开奖记录</div>`;
  return `<div class="history-list">${list.map((rec, i) => `
    <details class="history-item" ${i === 0 ? "open" : ""}>
      <summary>
        <div><b>${esc(rec.title)}</b><span class="muted">${fmtTime(rec.finished_at)} · ${rec.mode === "wheel" ? "转盘抽奖" : "随机开奖"} · ${rec.winners.length} 人中奖</span></div>
        <span class="chev">›</span>
      </summary>
      <div class="history-body">
        ${rec.winners.length
          ? rec.winners.map((w) => `<div class="h-row">
              <span class="h-name">${esc(w.name)}</span>
              <span class="h-prize">${esc(prizeLabel(w))}</span>
              <span class="h-reward muted">${w.reward_type === "cdk" ? "专属 CDK" : esc(w.reward_name)}</span>
            </div>`).join("")
          : `<div class="muted">本轮无人中奖</div>`}
      </div>
    </details>`).join("")}</div>`;
}

async function parseRosterFile(file) {
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch(API("/admin/roster/parse"), {
    method: "POST",
    headers: { Authorization: "Bearer " + app.adminToken },
    body: fd,
  });
  const ct = res.headers.get("content-type") || "";
  let data = null;
  if (ct.includes("application/json")) data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(detailMessage(data && data.detail, res.status));
  return data;
}

async function handleRosterFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const info = document.getElementById("rosterParseInfo");
  const ta = document.querySelector('#rosterImportForm textarea[name="names"]');
  if (info) info.textContent = "正在解析文件…";
  try {
    const data = await parseRosterFile(file);
    if (ta) ta.value = data.names.join("\n");
    if (info) {
      info.className = "hint";
      info.textContent = `已从 ${file.name}（${data.format}）识别到 ${data.names.length} 个名字，可在上方修改后导入。`;
    }
  } catch (e) {
    if (info) { info.className = "hint warn-text"; info.textContent = e.message; }
    toast(e.message, "error", 4200);
  }
}

function rosterNamesFromForm(form) {
  const ta = form.querySelector('[name="names"]');
  const seen = new Set();
  const names = [];
  for (const raw of String(ta ? ta.value : "").split(/\r?\n/)) {
    const name = raw.trim();
    if (!name) continue;
    const key = name.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    names.push(name);
  }
  return names;
}

async function submitRosterImport(form) {
  const names = rosterNamesFromForm(form);
  if (!names.length) return toast("名单为空，请先选择文件或粘贴名字", "error");
  const mode = form.querySelector('[name="mode"]').value;
  const btn = form.querySelector('[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = "导入中…"; }
  try {
    const res = await api(API("/admin/roster/replace"), { method: "POST", body: { names, mode } });
    app.adminState = res.state;
    syncServer(res.state);
    closeModal();
    render();
    toast(`已导入 ${res.added} 人${mode === "replace" ? "（替换名单）" : "（追加）"}`, "success", 3800);
  } catch (e) {
    toast(e.message, "error", 4200);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "确认导入"; }
  }
}

/* ============================================================

   ============================================================ */
function setupCanvas(canvas) {
  const rect = canvas.getBoundingClientRect();
  const size = Math.max(160, Math.round(rect.width || (canvas.parentElement && canvas.parentElement.clientWidth) || 320));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, size };
}

function paintWheel(ctx, size, names, rotation) {
  const cx = size / 2, cy = size / 2, r = size / 2 - 8;
  ctx.clearRect(0, 0, size, size);
  if (!names || !names.length) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,.05)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.16)";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "#a99fc4";
    ctx.font = `600 ${Math.max(12, size * 0.045)}px "Segoe UI","PingFang SC",sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("暂无合格参与者", cx, cy);
    return;
  }

  const n = names.length;
  const seg = (Math.PI * 2) / n;
  const colors = ["#f6c453", "#a78bfa", "#f472b6", "#22d3ee", "#34d399", "#fb923c", "#ffdf8e"];

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  for (let i = 0; i < n; i++) {
    const a0 = i * seg, a1 = (i + 1) * seg;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = "rgba(10,6,20,.55)";
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.save();
    ctx.rotate(a0 + seg / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#1c1030";
    const fontSize = Math.max(8, Math.min(15, (size / Math.max(n, 1)) * 0.32));
    ctx.font = `800 ${fontSize}px "Segoe UI","PingFang SC",sans-serif`;
    let label = String(names[i]);
    if (label.length > 7) label = label.slice(0, 6) + "…";
    ctx.fillText(label, r - Math.max(10, size * 0.04), 0);
    ctx.restore();
  }
  ctx.restore();

  // hub
  const hub = Math.max(26, size * 0.11);
  ctx.beginPath();
  ctx.arc(cx, cy, hub, 0, Math.PI * 2);
  ctx.fillStyle = "#1a0f2e";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#f6c453";
  ctx.stroke();
  ctx.fillStyle = "#f6c453";
  ctx.font = `800 ${Math.max(10, hub * 0.36)}px "Segoe UI",sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("LUCKY", cx, cy);

  // rim
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.lineWidth = Math.max(4, size * 0.018);
  ctx.strokeStyle = "rgba(246,196,83,.6)";
  ctx.stroke();
}

function previewNames() {
  const all = (app.adminState && app.adminState.eligible_names) || [];
  if (all.length <= 24) return all;
  return shuffle(all).slice(0, 24);
}

function drawPreviewWheel() {
  const canvas = document.getElementById("previewWheel");
  if (!canvas) return;
  const { ctx, size } = setupCanvas(canvas);
  paintWheel(ctx, size, previewNames(), 0.55);
}

function spinWheel(canvas, names, durationMs, done) {
  if (!names || !names.length) { if (done) done(); return; }
  const { ctx, size } = setupCanvas(canvas);
  const start = performance.now();
  const turns = Math.PI * 2 * (6 + Math.random() * 2.5) + Math.random() * Math.PI * 2;

  function frame(now) {
    const t = Math.min(1, (now - start) / Math.max(400, durationMs));
    const eased = 1 - Math.pow(1 - t, 4);
    paintWheel(ctx, size, names, turns * eased);
    if (t < 1) requestAnimationFrame(frame);
    else if (done) done();
  }
  requestAnimationFrame(frame);
}

function showDrawOverlay(draw) {
  app.activeDrawId = draw.id;
  const ov = document.getElementById("drawOverlay");
  const isWheel = draw.mode === "wheel";
  const isAdminView = !!app.adminState;
  let names = null;
  if (isAdminView && isWheel) names = previewNames();
  const totalEligible = (app.adminState && (app.adminState.eligible_names || []).length) || draw.eligible_count;
  const subsetNote = isAdminView && isWheel && names && names.length < totalEligible
    ? `<div class="ov-note">转盘随机展示 ${names.length} 人，实际从全部 ${draw.eligible_count} 名合格参与者中抽取</div>` : "";

  ov.innerHTML = `
    <div class="ov-inner">
      <div class="eyebrow">${esc(draw.title || "开奖")} · ${isWheel ? "转盘抽奖" : "随机开奖"}</div>
      <h2>${isWheel ? "转盘转动中…" : "抽取中…"}</h2>
      <div class="ov-stage">
        ${isWheel
          ? (isAdminView && names
              ? `<div class="wheel-holder"><div class="wheel-pointer"></div><canvas id="wheelCanvas"></canvas></div>`
              : `<div class="pulse-ring"></div>`)
          : `<div class="pulse-ring"></div>${isAdminView ? `<div class="ov-name" id="ovName">?</div>` : ""}`}
      </div>
      <div class="ov-count"><span id="ovCountdown">--</span><small>秒后公布</small></div>
      <div class="ov-prizes">${(draw.prizes || []).map((p) => `<span class="chip">${esc(p.title)} × ${p.quantity}</span>`).join("")}</div>
      <div class="ov-sub">共 ${esc(draw.eligible_count)} 名合格参与者，将抽出 ${esc(draw.total_winners)} 个奖项</div>
      ${subsetNote}
    </div>`;
  ov.classList.add("show");
  document.body.style.overflow = "hidden";

  const revealMs = new Date(draw.reveal_at).getTime();
  const remaining = Math.max(400, revealMs - serverNow());

  clearInterval(overlayTimer);
  clearInterval(scrambleTimer);

  if (isAdminView && isWheel && names && names.length) {
    requestAnimationFrame(() => {
      const canvas = document.getElementById("wheelCanvas");
      if (canvas) spinWheel(canvas, names, remaining);
    });
  }

  if (draw.mode === "random" && isAdminView) {
    const pool = (app.adminState && app.adminState.eligible_names) || [];
    if (pool.length) {
      scrambleTimer = setInterval(() => {
        const el = document.getElementById("ovName");
        if (!el) { clearInterval(scrambleTimer); return; }
        el.textContent = pool[Math.floor(Math.random() * pool.length)];
      }, 70);
    }
  }

  overlayTimer = setInterval(() => {
    const el = document.getElementById("ovCountdown");
    if (!el) return;
    const diff = revealMs - serverNow();
    el.textContent = Math.max(0, diff / 1000).toFixed(1);
  }, 90);
}

function hideDrawOverlay() {
  clearInterval(overlayTimer);
  clearInterval(scrambleTimer);
  const ov = document.getElementById("drawOverlay");
  ov.classList.remove("show");
  ov.innerHTML = "";
  if (!document.getElementById("modalRoot").innerHTML) document.body.style.overflow = "";
}

function maybeShowOrCompleteDraw(state) {
  const current = state.current_draw;
  if (current) {
    if (app.activeDrawId !== current.id) showDrawOverlay(current);
    return;
  }
  if (!app.activeDrawId) return;
  const id = app.activeDrawId;
  if (!state.history || !state.history.some((r) => r.id === id)) return;
  hideDrawOverlay();
  app.activeDrawId = null;
  const key = (IS_ADMIN ? "admin:" : "p:") + id;
  if (app.shownResults.has(key)) return;
  app.shownResults.add(key);
  showFinishedResult(id);
}

async function onDrawFinished(drawId) {
  if (!drawId) return;
  const key = (IS_ADMIN ? "admin:" : "p:") + drawId;
  app.activeDrawId = null;
  hideDrawOverlay();
  if (IS_ADMIN) await refreshAdmin();
  else await refreshParticipant();
  if (app.shownResults.has(key)) return;
  app.shownResults.add(key);
  showFinishedResult(drawId);
}

async function refreshPublic() {
  try {
    const s = await api("/api/public?room=" + encodeURIComponent(ROOM_CODE || ""), { token: null });
    app.roomMissing = false;
    app.publicState = s;
    syncServer(s);
    render();
    if (s.current_draw) {
      if (app.activeDrawId !== s.current_draw.id) showDrawOverlay(s.current_draw);
    } else if (app.activeDrawId && !app.participantToken) {
      app.activeDrawId = null;
      hideDrawOverlay();
    }
  } catch (e) {
    if (e.status === 404) { app.roomMissing = true; app.publicState = null; render(); }
    /* offline otherwise: keep last state */
  }
}

async function refreshParticipant() {
  if (!app.participantToken) return;
  try {
    const s = await api(API("/participant/state"));
    app.participantState = s;
    app.publicState = null;
    syncServer(s);
    render();
    maybeShowOrCompleteDraw(s);
  } catch (e) {
    if (e.status === 401) {
      localStorage.removeItem(LS_P);
      app.participantToken = null;
      app.participantState = null;
      closeWS();
      await refreshPublic();
      toast("参会凭证已失效，请重新" + (app.publicState && app.publicState.event.pool_mode === "roster" ? "认领身份" : "加入活动"), "error");
    } else if (e.status === 403 || e.status === 404) {
      localStorage.removeItem(LS_P);
      app.participantToken = null;
      app.participantState = null;
      closeWS();
      await refreshPublic();
    }
  }
}

async function refreshAdmin() {
  if (!app.adminToken) return;
  try {
    const s = await api(API("/admin/state"));
    app.adminState = s;
    syncServer(s);
    pruneDrawDraft(s);
    render();
    maybeShowOrCompleteDraw(s);
  } catch (e) {
    if (e.status === 401 || e.status === 403 || e.status === 404) {
      localStorage.removeItem(LS_A);

/* ============================================================
   WebSocket
   ============================================================ */
let ws = null;
let wsPing = null;
let wsRetry = 0;

function wsAlive() { return !!ws && ws.readyState === WebSocket.OPEN; }

function closeWS() {
  clearInterval(wsPing);
  if (ws) {
    try { ws.onclose = null; ws.onmessage = null; ws.close(); } catch (e) {}
    ws = null;
  }
}

function connectWS() {
  if (IS_ENTRY || !ROOM_CODE) return;
  const token = IS_ADMIN ? app.adminToken : app.participantToken;
  if (!token) return;
  closeWS();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = `${proto}://${location.host}/ws?role=${IS_ADMIN ? "admin" : "participant"}&room=${encodeURIComponent(ROOM_CODE)}&token=${encodeURIComponent(token)}`;
  try { ws = new WebSocket(url); } catch (e) { return; }

  ws.onopen = () => {
    wsRetry = 0;
    clearInterval(wsPing);
    wsPing = setInterval(() => {
      if (wsAlive()) { try { ws.send("ping"); } catch (e) {} }
    }, 30000);
  };

  ws.onmessage = (event) => {
    if (event.data === "pong") return;
    let msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    handleWs(msg);
  };

  ws.onerror = () => {};

  ws.onclose = (event) => {
    clearInterval(wsPing);
    ws = null;
    if (event.code === 4401) {
      if (IS_ADMIN) refreshAdmin();
      else refreshParticipant();
      return;
    }
    const tokenNow = IS_ADMIN ? app.adminToken : app.participantToken;
    if (!tokenNow) return;
    const delay = Math.min(10000, 1200 * Math.pow(1.7, wsRetry++));
    setTimeout(() => {
      const still = IS_ADMIN ? app.adminToken : app.participantToken;
      if (still === tokenNow) connectWS();
    }, delay);
  };
}

function handleWs(msg) {
  if (!msg || !msg.type) return;
  switch (msg.type) {
    case "hello":
      break;
    case "refresh":
    case "draw_started":
      scheduleRefresh();
      break;
    case "draw_finished":
      onDrawFinished(msg.draw_id);
      break;
    case "schedule_failed":
      toast("定时开奖失败：" + (msg.message || "未知原因"), "error", 5000);
      scheduleRefresh();
      break;
  }
}

  const editing = !!app.editingPrizeId;
  try {
    const res = await api(editing ? API(`/admin/prizes/${app.editingPrizeId}`) : API("/admin/prizes"), {
      method: editing ? "PATCH" : "POST",
      body: payload,
    });
    app.adminState = res.state;
    syncServer(res.state);
    app.editingPrizeId = null;
    closeModal();
    render();
    toast(editing ? "奖项已更新" : "奖项已添加", "success");
  } catch (e) {
    toast(e.message, "error", 4200);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "保存奖项"; }
  }
}

function confirmDeletePrize(prizeId) {
  const prize = app.adminState && app.adminState.prizes.find((p) => p.id === prizeId);
  if (!prize) return;
  openConfirm({
    title: "删除奖项",
    message: `确定删除「${prize.title}」吗？该操作不可撤销，已发放的 CDK 记录会保留在中奖历史中。`,
    confirmText: "删除",
    danger: true,
    onConfirm: async () => {
      try {
        const res = await api(API(`/admin/prizes/${prizeId}`), { method: "DELETE" });
        app.adminState = res.state;
        syncServer(res.state);
        app.drawDraft.prizeIds.delete(prizeId);
        closeModal();
        render();
        toast("奖项已删除", "success");
      } catch (e) { toast(e.message, "error"); }
    },
  });
}

async function startDraw(button) {
  if (!app.adminState) return;
  const d = app.drawDraft;
  const prizes = app.adminState.prizes.filter((p) => d.prizeIds.has(p.id));
  if (!prizes.length) return toast("请至少选择一个奖项", "error");
  if (app.busy) return;
  app.busy = true;
  if (button) { button.disabled = true; button.textContent = "开奖中…"; }
  try {
    const res = await api(API("/admin/draws"), {
      method: "POST",
      body: {
        title: (d.title || defaultDrawTitle()).trim(),
        mode: d.mode,
        prize_ids: prizes.map((p) => p.id),
      },
    });
    app.adminState = res.state;
    syncServer(res.state);
    render();
    showDrawOverlay(res.draw);
  } catch (e) {
    toast(e.message, "error", 4200);
    if (button) { button.disabled = false; button.textContent = "立即开奖"; }
  } finally {
    app.busy = false;
  }
}

function openScheduleModal() {
  if (!app.adminState) return;
  const d = app.drawDraft;
  const prizes = app.adminState.prizes.filter((p) => d.prizeIds.has(p.id));
  if (!prizes.length) return toast("请至少选择一个奖项", "error");
  const total = prizes.reduce((a, p) => a + p.quantity, 0);
  const defaultAt = new Date(Date.now() + 5 * 60 * 1000);
  openModal(`
    <div class="modal-head"><h2>定时开奖</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭">✕</button></div>
    <form id="scheduleForm" class="form-stack">
      <div class="muted small" style="margin-bottom:.8rem">
        ${esc(d.title || defaultDrawTitle())} · ${d.mode === "wheel" ? "转盘抽奖" : "随机开奖"}<br>
        奖项：${prizes.map((p) => `${esc(p.title)}×${p.quantity}`).join("、")} · 共 ${total} 个名额
      </div>
      <label class="field">开奖时间（本地时间）
        <input class="input" name="at" type="datetime-local" value="${localDatetimeValue(defaultAt)}" min="${localDatetimeValue(new Date(Date.now() + 60 * 1000))}" required>
      </label>
      <p class="hint">定时任务运行在服务器上，关闭主办方页面后仍会执行。免费实例重启会导致定时任务丢失。</p>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" data-action="close-modal">取消</button>
        <button class="btn btn-primary" type="submit">确认定时</button>
      </div>
    </form>
  `);
}

async function submitSchedule(form) {
  const atEl = form.querySelector('[name="at"]');
  const at = atEl ? new Date(atEl.value) : null;
  if (!at || isNaN(at.getTime())) return toast("请选择开奖时间", "error");
  const d = app.drawDraft;
  const prizes = app.adminState.prizes.filter((p) => d.prizeIds.has(p.id));
  if (!prizes.length) return toast("请至少选择一个奖项", "error");
  const btn = form.querySelector('[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = "提交中…"; }
  try {
    const res = await api(API("/admin/schedule"), {
      method: "POST",
      body: {
        title: (d.title || defaultDrawTitle()).trim(),
        mode: d.mode,
        prize_ids: prizes.map((p) => p.id),
        scheduled_at: at.toISOString(),
      },
    });
    app.adminState = res.state;
    syncServer(res.state);
    closeModal();
    render();
    toast("定时开奖已设置", "success");
  } catch (e) {
    toast(e.message, "error", 4200);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "确认定时"; }
  }
}

async function cancelSchedule() {
  try {
    const res = await api(API("/admin/schedule"), { method: "DELETE" });
    app.adminState = res.state;
    syncServer(res.state);
    render();
    toast("定时开奖已取消", "success");
  } catch (e) { toast(e.message, "error"); }
}

function confirmRemoveParticipant(id, name) {
  openConfirm({
    title: "移除参与者",
    message: `确定将「${name}」移出本活动吗？对方页面会提示凭证失效，历史中已有的中奖记录不受影响。`,
    confirmText: "移除",
    danger: true,
    onConfirm: async () => {
      try {
        const res = await api(API(`/admin/participants/${id}`), { method: "DELETE" });
        app.adminState = res.state;
        syncServer(res.state);
        closeModal();
        render();
        toast("参与者已移除", "success");
      } catch (e) { toast(e.message, "error"); }
    },
  });
}

function confirmClearHistory() {
  openConfirm({
    title: "清空中奖记录",
    message: "确定清空所有中奖历史吗？清空后无法恢复，CDK 的已发放记录也会重置。建议先导出 Excel / TXT 存档。",
    confirmText: "清空",
    danger: true,
    onConfirm: async () => {
      try {
        const res = await api(API("/admin/history/clear"), { method: "POST" });
        app.adminState = res.state;
        syncServer(res.state);
        app.shownResults.clear();
        closeModal();
        render();
        toast("中奖记录已清空", "success");
      } catch (e) { toast(e.message, "error"); }
    },
  });
}

async function exportFile(kind, style) {
  if (!app.adminToken) return;
  const query = style ? "?kind=" + encodeURIComponent(style) : "";
  try {
    const res = await fetch(API(`/admin/export.${kind}`) + query, {
      headers: { Authorization: "Bearer " + app.adminToken },
    });
    if (!res.ok) {
      let msg = "导出失败";
      try {
        const data = await res.json();
        if (data && data.detail) msg = detailMessage(data.detail, res.status);
      } catch (e) {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${ROOM_CODE ? ROOM_CODE + "_" : ""}${style === "participant" ? "winners" : "lucky_draw_results"}_${fileStamp()}.${kind}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("导出已开始", "success");
  } catch (e) {
    toast(e.message, "error");
  }
}

function filterParticipants(query) {
  const q = String(query || "").trim().toLowerCase();
  $$("[data-participant-row]").forEach((row) => {
    const name = row.dataset.name || "";
    row.style.display = !q || name.includes(q) ? "" : "none";
  });
}

/* ============================================================
   Global events
   ============================================================ */
document.addEventListener("click", async (event) => {
  const copyEl = event.target.closest("[data-copy]");
  if (copyEl) {
    event.preventDefault();
    copyText(copyEl.dataset.copy);
    return;
  }
  const btn = event.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  switch (action) {
    case "close-modal":
      closeModal();
      break;
    case "admin-tab":
      app.adminTab = btn.dataset.tab;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      break;
    case "admin-logout":
      await adminLogout();
      break;
    case "copy-participant-link":
      copyText(roomURL());
      break;
    case "copy-admin-link":
      copyText(adminURLFor());
      break;
    case "goto-own-admin":
      location.href = adminURLFor(ROOM_CODE);
      break;
    case "roster-import":
      openRosterImport();
      break;
    case "roster-add":
      openRosterAdd();
      break;
    case "roster-rename":
      openRosterRename(btn.dataset.id, btn.dataset.name);
      break;
    case "roster-clear":
      confirmClearRoster();
      break;
    case "pin-change":
      openPinChange();
      break;
    case "export-winners":
      await exportFile("xlsx", "participant");
      break;
    case "save-event":
      await saveEvent();
      break;
    case "prize-new":
      openPrizeModal(null);
      break;
    case "prize-edit": {
      const prize = app.adminState && app.adminState.prizes.find((p) => p.id === btn.dataset.id);
      if (prize) openPrizeModal(prize);
      break;
    }
    case "prize-delete":
      confirmDeletePrize(btn.dataset.id);
      break;
    case "draw-now":
      await startDraw(btn);
      break;
    case "schedule-open":
      openScheduleModal();
      break;
    case "schedule-cancel":
      await cancelSchedule();
      break;
    case "remove-participant":
      confirmRemoveParticipant(btn.dataset.id, btn.dataset.name);
      break;
    case "history-clear":
      confirmClearHistory();
      break;
    case "export-xlsx":
      await exportFile("xlsx");
      break;
    case "export-txt":
      await exportFile("txt");
      break;
  }
});

document.addEventListener("change", async (event) => {
  const t = event.target;
  if (t.matches('[data-toggle="registration"]')) {
    await patchEvent({ registration_open: t.checked });
  } else if (t.matches('[data-toggle="cooldown"]')) {
    await patchEvent({ cooldown_enabled: t.checked });
  } else if (t.matches("[data-prize-check]")) {
    if (t.checked) app.drawDraft.prizeIds.add(t.value);
    else app.drawDraft.prizeIds.delete(t.value);
    updateDrawTotals();
  } else if (t.matches("[data-mode-check]")) {
    app.drawDraft.mode = t.value;
    $$(".mode-card").forEach((card) => {
      const input = card.querySelector("input");
      card.classList.toggle("active", !!input && input.checked);
    });
  } else if (t.matches('#prizeForm select[name="reward_type"]')) {
    togglePrizeRewardFields(t.value);
  } else if (t.id === "poolModeSelect") {
    if (app.adminState && t.value !== app.adminState.event.pool_mode) {
      confirmSwitchPoolMode(t.value);
    }
  } else if (t.matches('#rosterImportForm input[name="file"]')) {
    await handleRosterFile(t);
  }
});

document.addEventListener("input", (event) => {
  const t = event.target;
  if (t.id === "eventNameInput") app.drafts.eventName = t.value;
  else if (t.id === "cooldownDaysInput") app.drafts.cooldownDays = t.value;
  else if (t.id === "drawTitleInput") app.drawDraft.title = t.value;
  else if (t.id === "joinNameInput") app.drafts.joinName = t.value;
  else if (t.id === "participantSearch") {
    app.drafts.search = t.value;
    filterParticipants(t.value);
  }
});

document.addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.target;
  if (form.id === "joinForm") {
    const input = form.querySelector('[name="name"]');
    await doJoin(input ? input.value : "");
  } else if (form.id === "claimForm") {
    const input = form.querySelector('[name="name"]');
    await doClaim(input ? input.value : "");
  } else if (form.id === "adminLoginForm") {
    const input = form.querySelector('[name="pin"]');
    await doAdminLogin(input ? input.value : "");
  } else if (form.id === "createRoomForm") {
    await doCreateRoom(form);
  } else if (form.id === "adminPinForm") {
    const input = form.querySelector('[name="pin"]');
    await doEntryAdminLogin(input ? input.value : "");
  } else if (form.id === "joinCodeForm") {
    const input = form.querySelector('[name="code"]');
    await enterRoomCode(input ? input.value : "");
  } else if (form.id === "rosterImportForm") {
    await submitRosterImport(form);
  } else if (form.id === "rosterAddForm") {
    await submitRosterAdd(form);
  } else if (form.id === "rosterRenameForm") {
    await submitRosterRename(form);
  } else if (form.id === "pinChangeForm") {
    await submitPinChange(form);
  } else if (form.id === "prizeForm") {
    await savePrizeForm(form);
  } else if (form.id === "scheduleForm") {
    await submitSchedule(form);
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if (document.getElementById("modalRoot").innerHTML) closeModal();
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (IS_ENTRY) return;
  if (IS_ADMIN && app.adminToken) refreshAdmin();
  else if (!IS_ADMIN) {
    if (app.participantToken) refreshParticipant();
    else refreshPublic();
  }
});

/* ============================================================
   Polling fallback
   ============================================================ */
setInterval(() => {
  if (document.hidden || app.busy || IS_ENTRY) return;
  if (wsAlive()) return;
  if (IS_ADMIN && app.adminToken) refreshAdmin();
  else if (!IS_ADMIN) {
    if (app.participantToken) refreshParticipant();
    else refreshPublic();
  }
}, 12000);

/* ============================================================
   Boot
   ============================================================ */
async function boot() {
  if (IS_ENTRY) {
    const params = new URLSearchParams(location.search);
    const missing = params.get("missing");
    if (missing) app.entryNotice = `没有找到空间「${missing}」。可能已被服务器重启清除，请向发起者确认最新链接。`;
    render();
    return;
  }
  if (IS_ADMIN) {
    if (app.adminToken) {
      render();
      await refreshAdmin();
      if (app.adminState) connectWS();
    } else {
      render();
    }
  } else {
    render();
    if (app.participantToken) {
      await refreshParticipant();
      if (app.participantState) connectWS();
      else await refreshPublic();
    } else {
      await refreshPublic();
    }
  }
  updateCountdowns();
}

boot();
</script>
